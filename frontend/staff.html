<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CafeBot — Staff Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="staff-page container">
    <div id="login-view">
      <h1><span data-brand="cafeName">CafeBot</span> — Staff Login</h1>
      <form id="login-form">
        <label for="staff-password">Password</label>
        <input type="password" id="staff-password" autocomplete="current-password" required />
        <p id="login-error"></p>
        <button type="submit">Log in</button>
      </form>
    </div>

    <div id="dashboard-view">
      <div class="order-top-row">
        <h1><span data-brand="cafeName">CafeBot</span> — Staff Dashboard</h1>
        <button id="logout-btn" class="btn-compact btn-compact-outline">Log out</button>
      </div>

      <div class="dashboard-summary">
        <div class="summary-card">
          <span class="summary-label">Today's Orders</span>
          <span class="summary-value" id="summary-count">0</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Today's Revenue</span>
          <span class="summary-value" id="summary-revenue">$0.00</span>
        </div>
      </div>

      <div class="dashboard-toolbar">
        <div id="filter-tabs" class="filter-tabs"></div>
        <button id="refresh-btn" class="btn-compact btn-compact-outline">Refresh</button>
      </div>

      <div id="orders" class="orders-grid"></div>
    </div>
  </div>

  <script>
    function showLoginView() {
      document.getElementById("dashboard-view").style.display = "none";
      document.getElementById("login-view").style.display = "block";
    }

    function showDashboardView() {
      document.getElementById("login-view").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";
    }

    async function checkSession() {
      try {
        const res = await fetch("/api/staff/session");
        const data = await res.json();
        if (data.authenticated) {
          showDashboardView();
          loadOrders();
        } else {
          showLoginView();
        }
      } catch (err) {
        showLoginView();
      }
    }

    async function hydrateBrand() {
      try {
        const res = await fetch("/api/brand");
        if (!res.ok) return;
        const brand = await res.json();
        if (brand.cafeName) {
          document.title = `${brand.cafeName} — Staff Dashboard`;
          document.querySelectorAll("[data-brand='cafeName']").forEach((el) => {
            el.textContent = brand.cafeName;
          });
        }
      } catch (err) {
        // Static defaults already in the markup keep the page correct if this fails.
      }
    }

    const NEXT_STATUS = {
      NEW: "PREPARING",
      PREPARING: "READY",
      READY: "COMPLETED",
    };
    const NEXT_LABEL = {
      NEW: "Start Preparing",
      PREPARING: "Mark Ready",
      READY: "Mark Completed",
    };

    let allOrders = [];
    let currentFilter = "ALL";
    const STATUS_FILTERS = ["ALL", "NEW", "PREPARING", "READY", "COMPLETED"];
    const STATUS_LABELS = {
      ALL: "All",
      NEW: "New",
      PREPARING: "Preparing",
      READY: "Ready",
      COMPLETED: "Completed",
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadOrders() {
      const container = document.getElementById("orders");
      container.innerHTML = "Loading...";

      try {
        const res = await fetch("/api/orders");
        if (res.status === 401) {
          showLoginView();
          return;
        }
        const data = await res.json();
        allOrders = Array.isArray(data) ? data : [];
      } catch (err) {
        container.innerHTML = '<p class="empty">Failed to load orders.</p>';
        return;
      }

      renderFilterTabs();
      renderDailySummary();
      renderOrders();
    }

    function renderOrders() {
      const container = document.getElementById("orders");
      const filtered =
        currentFilter === "ALL" ? allOrders : allOrders.filter((o) => o.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<p class="empty">No orders yet.</p>';
        return;
      }

      container.innerHTML = "";
      [...filtered].reverse().forEach((order) => container.appendChild(renderOrderCard(order)));
    }

    function applyFilter(status) {
      currentFilter = status;
      renderFilterTabs();
      renderOrders();
    }

    function renderFilterTabs() {
      const tabs = document.getElementById("filter-tabs");
      tabs.innerHTML = STATUS_FILTERS.map((status) => {
        const count =
          status === "ALL" ? allOrders.length : allOrders.filter((o) => o.status === status).length;
        const activeClass = status === currentFilter ? " is-active" : "";
        return `<button type="button" class="filter-tab${activeClass}" data-status="${status}">${STATUS_LABELS[status]} <span class="filter-tab-count">${count}</span></button>`;
      }).join("");

      tabs.querySelectorAll(".filter-tab").forEach((btn) => {
        btn.addEventListener("click", () => applyFilter(btn.dataset.status));
      });
    }

    function isToday(isoString) {
      const d = new Date(isoString);
      const now = new Date();
      return (
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate()
      );
    }

    function renderDailySummary() {
      const todaysOrders = allOrders.filter((o) => o.createdAt && isToday(o.createdAt));
      const revenue = todaysOrders.reduce((sum, o) => sum + (o.pricing ? o.pricing.total : 0), 0);

      document.getElementById("summary-count").textContent = todaysOrders.length;
      document.getElementById("summary-revenue").textContent = `$${revenue.toFixed(2)}`;
    }

    function formatOrderTime(isoString) {
      if (!isoString) return "";
      const d = new Date(isoString);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function renderOrderCard(order) {
      const card = document.createElement("div");
      card.className = "order-card";

      const itemsHtml = order.items
        .map((item) => {
          const details = [item.size, ...(item.options || [])].filter(Boolean).join(", ");
          return `<li>${item.quantity}x ${escapeHtml(item.name)}${details ? ` (${escapeHtml(details)})` : ""}</li>`;
        })
        .join("");

      const f = order.fulfillment || {};
      let fulfillmentHtml = "";
      if (f.type === "pickup") {
        fulfillmentHtml = `Pickup — ${escapeHtml(f.name || "?")}${
          f.pickupTime ? `, ${escapeHtml(f.pickupTime)}` : " (ASAP)"
        }`;
      } else if (f.type === "delivery") {
        fulfillmentHtml = `Delivery — ${escapeHtml(f.name || "?")}, ${escapeHtml(f.phone || "?")}<br>${escapeHtml(
          f.address || "?"
        )}${f.aptUnit ? `, ${escapeHtml(f.aptUnit)}` : ""}${
          f.deliveryInstructions ? `<br><em>${escapeHtml(f.deliveryInstructions)}</em>` : ""
        }`;
      } else {
        fulfillmentHtml = "Fulfillment type not set";
      }

      const total = order.pricing ? `$${order.pricing.total.toFixed(2)}` : "—";
      const nextStatus = NEXT_STATUS[order.status];
      const timeLabel = formatOrderTime(order.createdAt);

      card.innerHTML = `
        <div class="order-top">
          <div class="order-id-block">
            <span class="order-id">${escapeHtml(order.orderId)}</span>
            ${timeLabel ? `<span class="order-time">${timeLabel}</span>` : ""}
          </div>
          <span class="status-badge status-${order.status}">${order.status}</span>
        </div>
        <ul class="order-items">${itemsHtml}</ul>
        <div class="order-fulfillment">${fulfillmentHtml}</div>
        <div class="order-card-footer">
          <div class="order-total">Total <strong>${total}</strong></div>
          <div class="order-actions"></div>
        </div>
      `;

      if (nextStatus) {
        const btn = document.createElement("button");
        btn.className = "btn-compact";
        btn.textContent = NEXT_LABEL[order.status];
        btn.addEventListener("click", () => updateStatus(order.orderId, nextStatus));
        card.querySelector(".order-actions").appendChild(btn);
      }

      return card;
    }

    async function updateStatus(orderId, status) {
      try {
        const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status }),
        });
        if (res.status === 401) {
          showLoginView();
          return;
        }
      } catch (err) {
        alert("Failed to update order status.");
      }
      loadOrders();
    }

    document.getElementById("refresh-btn").addEventListener("click", loadOrders);
    document.getElementById("logout-btn").addEventListener("click", async () => {
      try {
        await fetch("/api/staff/logout", { method: "POST" });
      } catch (err) {
        // fall through to showing the login view regardless
      }
      showLoginView();
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      const passwordInput = document.getElementById("staff-password");
      errorEl.textContent = "";

      try {
        const res = await fetch("/api/staff/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "Login failed.";
          return;
        }
        passwordInput.value = "";
        showDashboardView();
        loadOrders();
      } catch (err) {
        errorEl.textContent = "Could not reach the server.";
      }
    });

    hydrateBrand();
    checkSession();
  </script>
</body>
</html>
